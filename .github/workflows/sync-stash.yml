# Fetch configured upstream Surge modules and Quantumult X rewrites, then refresh the Stash overrides on main.
# GITHUB_TOKEN is enough: this workflow does not use extra secrets.
# The source list lives in scripts/stash_sources.py.
name: Sync Stash overrides

on:
  schedule:
    - cron: "45 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stash-overrides
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch modules and convert
        id: sync
        run: |
          set -euo pipefail
          python3 -m venv /tmp/stash-sync
          /tmp/stash-sync/bin/pip install --disable-pip-version-check 'pyyaml==6.0.1'
          set +e
          /tmp/stash-sync/bin/python scripts/sync_stash_overrides.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0: everything matched upstream. 2: an upstream was rejected and the
          # last good override/script was kept (failover state may have changed).
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Commit and push when an override changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Stash/
          if git diff --cached --quiet; then
            echo "No override changes."
            exit 0
          fi
          git commit -m "chore: sync Stash overrides"
          git push origin HEAD:main

      - name: Fail when an upstream source was rejected
        if: steps.sync.outputs.code == '2'
        run: |
          echo "One or more upstreams failed validation. Last good copies were kept."
          exit 1
